name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.5.2)'
        required: true

# Create a GitHub release when a v* tag is pushed. No Docker build (the bot
# is pure Python that runs in the parent databyte-Ikev2 portal process).
# Triggers on every v* tag push — re-push of an existing tag will also fire
# (used to backfill releases for v2.5.0/v2.5.1/v2.5.2 that were tagged
# before this workflow existed).
permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
